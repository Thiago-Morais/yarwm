services:
    dev:
        build:
            # The repo is mounted, not copied, so keep the context small.
            context: ./docker/dev
            args:
                DEV_UID: ${DEV_UID:-1000}
                DEV_GID: ${DEV_GID:-1000}
        image: yarwm-dev
        working_dir: /workspace
        volumes:
            - .:/workspace
        stdin_open: true
        tty: true

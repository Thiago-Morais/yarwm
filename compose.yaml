services:
  dev:
    build:
      context: .
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    image: yarwm-dev:go1.27.3
    working_dir: /workspace
    volumes:
      # The repo, including .cache/ (Go module + build caches) and build/.
      - .:/workspace
    stdin_open: true
    tty: true

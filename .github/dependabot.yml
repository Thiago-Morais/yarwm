# Keeps every pinned version current. Each update arrives as a pull request
# against dev, where CI runs `make check` before anyone merges it.
version: 2

updates:
    # Go toolchain and golangci-lint: the FROM lines in the dev image.
    - package-ecosystem: docker
      directory: /docker/dev
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope

    # actions/checkout and any other actions in .github/workflows.
    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
          include: scope

    # Go module dependencies in go.mod (none yet).
    - package-ecosystem: gomod
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope

version: 2

updates:
    - package-ecosystem: docker
      directory: /docker/dev
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope

    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
          include: scope

    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope

    - package-ecosystem: gomod
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope

name: check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # `git describe` needs the tags.
                  fetch-depth: 0

            - name: Format, lint and test
              run: make check

            - name: Build and smoke-test the binary
              run: |
                  make build
                  ./build/yarwm version
